<!DOCTYPE html>
<html>
<head>
    <title>YOLO Object Detection</title>
</head>
<body>
    <h1>Upload a Video for Detection</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="video">
        <input type="submit" value="Upload & Run">
    </form>

    <h2>Live Camera Stream</h2>
    <img src="{{ url_for('camera_feed') }}" width="640" height="480">

    <h2>Uploaded Video Stream</h2>
    {% if video_path %}
        <img src="{{ url_for('video_feed', source=video_path) }}" width="640" height="480">
    {% endif %}

    <p>To view your uploaded video with detection, go to:<br>
    <code>/video_feed/&lt;filename&gt;</code></p>
</body>
</html>
